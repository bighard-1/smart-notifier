<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Notifier</title>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/element-plus"></script>
  <script src="https://unpkg.com/@element-plus/icons-vue"></script>
  <style>
    :root {
      --bg-body: #0f172a;
      --bg-card: #1e293b;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-color: var(--bg-body);
      color: var(--text-primary);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    [v-cloak] {
      display: none;
    }

    .app-shell {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .app-header {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    .app-title {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .stats-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .auth-card,
    .panel-card,
    .task-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      border-radius: 12px;
    }

    .auth-wrap {
      min-height: calc(100vh - 100px);
      display: grid;
      place-items: center;
    }

    .auth-card {
      width: min(460px, 100%);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .toolbar-left,
    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .panel-card {
      margin-bottom: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: 20px;
    }

    .form-grid .full-row {
      grid-column: 1 / -1;
    }

    .field-hint {
      margin-top: -10px;
      margin-bottom: 16px;
      padding-left: 120px;
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 1.5;
    }

    .task-card {
      height: 100%;
      min-height: 230px;
      transition: all 0.3s ease;
    }

    .task-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
    }

    .task-card .el-card__body {
      height: 100%;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .task-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .task-title {
      min-width: 0;
      margin: 0;
      color: var(--text-primary);
      font-size: 16px;
      font-weight: 700;
      line-height: 1.4;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .task-card-body {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }

    .task-remark {
      display: -webkit-box;
      min-height: 38px;
      margin: 0;
      overflow: hidden;
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 1.45;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .countdown-box {
      display: flex;
      height: 40px;
      align-items: center;
      flex-shrink: 0;
      border-radius: 6px;
      background: #0f172a;
      padding: 0 10px;
      overflow: hidden;
    }

    .countdown-text {
      color: var(--countdown-color);
      font-family: "Courier New", Courier, monospace;
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .countdown-text.is-urgent {
      animation: pulse 1.5s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from {
        opacity: 0.6;
      }
      to {
        opacity: 1;
      }
    }

    .task-actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: auto;
      padding-top: 16px;
      min-height: 58px;
      align-items: center;
      border-top: 1px solid rgba(51, 65, 85, 0.72);
      position: relative;
      z-index: 2;
    }

    .task-action-btn {
      width: 100%;
      min-width: 0;
      height: 36px;
      margin-left: 0 !important;
    }

    .task-action-btn .el-icon + span {
      margin-left: 4px;
    }

    .empty-state {
      padding: 42px 0;
      border: 1px dashed var(--border-color);
      border-radius: 8px;
      background: rgba(30, 41, 59, 0.55);
    }

    .el-card {
      --el-card-bg-color: var(--bg-card);
      --el-card-border-color: var(--border-color);
      --el-card-padding: 18px;
    }

    .el-card__header {
      color: var(--text-primary);
      border-bottom-color: var(--border-color);
      font-weight: 700;
    }

    .el-form-item__label,
    .el-radio,
    .el-dialog__title {
      color: var(--text-primary);
    }

    .el-input__wrapper,
    .el-select__wrapper {
      background: #0f172a;
      border: 1px solid var(--border-color);
      box-shadow: none;
    }

    .el-date-editor.el-input,
    .el-date-editor.el-input__wrapper {
      width: 100%;
    }

    .el-input__inner,
    .el-select__placeholder {
      color: var(--text-primary);
    }

    .el-input__inner::placeholder {
      color: var(--text-secondary);
    }

    .el-radio__label {
      color: var(--text-primary);
    }

    .el-dialog {
      --el-dialog-bg-color: var(--bg-card);
      --el-dialog-border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .el-dialog__body {
      color: var(--text-primary);
    }

    @media (max-width: 720px) {
      .app-header {
        height: auto;
        align-items: flex-start;
        flex-direction: column;
      }

      .stats-bar {
        justify-content: flex-start;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .field-hint {
        padding-left: 0;
      }
    }
  </style>
</head>
<body>
<div id="app" v-cloak>
  <main class="app-shell">
    <header class="app-header">
      <h1 class="app-title">Smart-Notifier</h1>
      <div v-if="authed" class="stats-bar">
        <el-tag effect="dark" type="warning">今日待办 {{ todayPending }}</el-tag>
        <el-tag effect="dark" type="success">本周完成 {{ weekCompleted }}</el-tag>
        <el-tag effect="dark" type="info">全部任务 {{ tasks.length }}</el-tag>
      </div>
    </header>

    <section v-if="!setupChecked" class="auth-wrap">
      <el-card class="auth-card">
        <template #header>正在检查</template>
        <el-skeleton :rows="4" animated />
      </el-card>
    </section>

    <section v-else-if="!configured" class="auth-wrap">
      <el-card class="auth-card">
        <template #header>首次设置</template>
        <el-form label-width="120px">
          <el-form-item label="系统名称">
            <el-input v-model="setupForm.app_name" />
          </el-form-item>
          <el-form-item label="时区">
            <el-input v-model="setupForm.scheduler_timezone" placeholder="Asia/Shanghai" />
          </el-form-item>
          <el-form-item label="Bot Token">
            <el-input v-model="setupForm.telegram_bot_token" show-password placeholder="从 BotFather 获取" />
          </el-form-item>
          <el-form-item label="管理员账号">
            <el-input v-model="setupForm.web_username" />
          </el-form-item>
          <el-form-item label="管理员密码">
            <el-input v-model="setupForm.web_password" type="password" show-password />
          </el-form-item>
          <el-form-item>
            <el-button type="primary" @click="saveInitialSetup">完成设置</el-button>
          </el-form-item>
        </el-form>
      </el-card>
    </section>

    <section v-else-if="!authed" class="auth-wrap">
      <el-card class="auth-card">
        <template #header>登录</template>
        <el-form label-width="90px">
          <el-form-item label="用户名">
            <el-input v-model="login.username" autocomplete="username" />
          </el-form-item>
          <el-form-item label="密码">
            <el-input v-model="login.password" type="password" autocomplete="current-password" show-password />
          </el-form-item>
          <el-form-item>
            <el-button type="primary" @click="doLogin">登录</el-button>
          </el-form-item>
        </el-form>
      </el-card>
    </section>

    <section v-else>
      <div class="toolbar">
        <div class="toolbar-left">
          <el-radio-group v-model="activeView">
            <el-radio-button label="tasks">任务</el-radio-button>
            <el-radio-button label="channels">通知渠道</el-radio-button>
            <el-radio-button label="backup">备份恢复</el-radio-button>
            <el-radio-button label="settings">系统设置</el-radio-button>
          </el-radio-group>
        </div>
      </div>

      <template v-if="activeView==='tasks'">
      <div class="toolbar">
        <div class="toolbar-left">
          <el-input v-model="chatId" placeholder="Chat ID 可选" style="width: 200px" />
          <el-select v-model="statusFilter" style="width: 140px" placeholder="状态">
            <el-option label="全部" value="" />
            <el-option label="待办" value="pending" />
            <el-option label="完成" value="completed" />
          </el-select>
        </div>
        <div class="toolbar-right">
          <el-button type="primary" @click="load">刷新</el-button>
          <el-button @click="logout">退出</el-button>
        </div>
      </div>

      <el-card class="panel-card">
        <template #header>新建任务</template>
        <el-form label-width="120px">
          <div class="form-grid">
            <el-form-item label="目标 Chat ID">
              <el-select
                v-model="form.chat_id"
                allow-create
                default-first-option
                filterable
                placeholder="选择已有 Chat ID 或手动输入"
                style="width: 100%"
              >
                <el-option
                  v-for="id in knownChatIds"
                  :key="id"
                  :label="id"
                  :value="id"
                />
              </el-select>
            </el-form-item>
            <el-form-item label="提醒类型">
              <el-radio-group v-model="form.is_recurring">
                <el-radio :value="false">一次性</el-radio>
                <el-radio :value="true">周期循环</el-radio>
              </el-radio-group>
            </el-form-item>
            <div class="full-row field-hint">
              Chat ID 是 Telegram 对话 ID，用来确定提醒发送给谁。给机器人发送 /myid 可获取；已有任务的 Chat ID 会自动出现在这里。
            </div>
            <el-form-item class="full-row" label="内容">
              <el-input v-model="form.content" />
            </el-form-item>
            <el-form-item class="full-row" label="备注">
              <el-input v-model="form.remarks" />
            </el-form-item>
            <el-form-item class="full-row" label="通知渠道">
              <el-select
                v-model="form.channel_ids"
                multiple
                clearable
                placeholder="不选则默认发送到目标 Chat ID"
                style="width: 100%"
              >
                <el-option
                  v-for="c in enabledChannels"
                  :key="c.id"
                  :label="`${c.name}（${channelTypeText(c.channel_type)}）`"
                  :value="c.id"
                />
              </el-select>
            </el-form-item>
            <el-form-item v-if="!form.is_recurring" label="提醒时间">
              <el-date-picker
                v-model="form.once_time"
                type="datetime"
                format="YYYY-MM-DD HH:mm"
                value-format="YYYY-MM-DD HH:mm:ss"
                placeholder="点击选择提醒日期和时间"
                style="width: 100%"
              />
            </el-form-item>

            <template v-else>
              <el-form-item class="full-row" label="循环方式">
                <el-radio-group v-model="form.recurring_mode">
                  <el-radio value="weekly">每周</el-radio>
                  <el-radio value="monthly">每月</el-radio>
                  <el-radio value="quarterly">每季度</el-radio>
                  <el-radio value="yearly">每年</el-radio>
                  <el-radio value="interval_days">每隔N天</el-radio>
                </el-radio-group>
              </el-form-item>
              <el-form-item label="时间">
                <el-time-picker
                  v-model="form.hhmm"
                  format="HH:mm"
                  value-format="HH:mm"
                  placeholder="点击选择提醒时间"
                  style="width: 100%"
                />
              </el-form-item>
              <el-form-item v-if="form.recurring_mode==='weekly'" label="周几">
                <el-select v-model="form.weekday">
                  <el-option label="周一" value="1" />
                  <el-option label="周二" value="2" />
                  <el-option label="周三" value="3" />
                  <el-option label="周四" value="4" />
                  <el-option label="周五" value="5" />
                  <el-option label="周六" value="6" />
                  <el-option label="周日" value="7" />
                </el-select>
              </el-form-item>
              <el-form-item v-if="form.recurring_mode==='monthly' || form.recurring_mode==='quarterly'" label="日期">
                <el-input-number v-model="form.month_day" :min="1" :max="31" controls-position="right" style="width: 100%" />
              </el-form-item>
              <el-form-item v-if="form.recurring_mode==='yearly'" label="日期">
                <el-date-picker
                  v-model="form.year_mmdd"
                  type="date"
                  format="MM-DD"
                  value-format="MM-DD"
                  placeholder="点击选择月日"
                  style="width: 100%"
                />
              </el-form-item>
              <el-form-item v-if="form.recurring_mode==='interval_days'" label="间隔天数">
                <el-input-number v-model="form.interval_days" :min="1" :max="3650" controls-position="right" style="width: 100%" />
              </el-form-item>
            </template>
          </div>
          <el-button type="success" @click="createTask">创建</el-button>
        </el-form>
      </el-card>

      <el-row v-if="tasks.length" :gutter="20">
        <el-col v-for="t in tasks" :key="t.id" :xs="24" :sm="12" :md="8" :lg="6">
          <el-card class="task-card">
            <div class="task-card-header">
              <h3 class="task-title" :title="t.content || '未命名任务'">{{ t.content || '未命名任务' }}</h3>
              <el-tag
                :effect="t.is_recurring ? 'plain' : 'dark'"
                :type="t.is_recurring ? 'info' : 'success'"
              >
                {{ t.is_recurring ? '周期(Cron)' : '单次' }}
              </el-tag>
            </div>

            <div class="task-card-body">
              <p class="task-remark">{{ t.remarks || '无备注' }}</p>
              <div class="countdown-box">
                <span
                  class="countdown-text"
                  :class="{ 'is-urgent': getCountdownState(getTaskTargetTime(t)).isUrgent }"
                  :style="{ '--countdown-color': getCountdownState(getTaskTargetTime(t)).color }"
                >
                  {{ getCountdownState(getTaskTargetTime(t)).text }}
                </span>
              </div>
            </div>

            <div class="task-actions">
              <el-button class="task-action-btn" type="warning" :icon="Clock" @click="openEdit(t)">编辑</el-button>
              <el-button class="task-action-btn" type="success" :icon="Check" :disabled="t.status==='completed'" @click="markDone(t)">完成</el-button>
              <el-button class="task-action-btn" type="danger" :icon="Delete" @click="deleteTask(t)">删除</el-button>
            </div>
          </el-card>
        </el-col>
      </el-row>

      <el-empty v-else class="empty-state" description="暂无任务" />

      <el-dialog v-model="edit.visible" title="修改任务" width="560px">
        <el-form label-width="110px">
          <el-form-item label="内容">
            <el-input v-model="edit.form.content" />
          </el-form-item>
          <el-form-item label="备注">
            <el-input v-model="edit.form.remarks" />
          </el-form-item>
          <el-form-item label="提醒时间">
            <el-date-picker
              v-model="edit.form.trigger_time"
              type="datetime"
              format="YYYY-MM-DD HH:mm"
              value-format="YYYY-MM-DD HH:mm:ss"
              placeholder="点击选择提醒日期和时间"
              style="width: 100%"
            />
          </el-form-item>
          <el-form-item label="循环规则">
            <el-input v-model="edit.form.cron_expr" placeholder="可留空" />
          </el-form-item>
          <el-form-item label="状态">
            <el-select v-model="edit.form.status" style="width: 160px">
              <el-option value="pending" label="pending" />
              <el-option value="completed" label="completed" />
            </el-select>
          </el-form-item>
          <el-form-item label="通知渠道">
            <el-select v-model="edit.form.channel_ids" multiple clearable style="width: 100%">
              <el-option
                v-for="c in enabledChannels"
                :key="c.id"
                :label="`${c.name}（${channelTypeText(c.channel_type)}）`"
                :value="c.id"
              />
            </el-select>
          </el-form-item>
        </el-form>
        <template #footer>
          <el-button @click="edit.visible=false">取消</el-button>
          <el-button type="primary" @click="saveEdit">保存</el-button>
        </template>
      </el-dialog>
      </template>

      <template v-if="activeView==='channels'">
        <el-card class="panel-card">
          <template #header>新增通知渠道</template>
          <el-form label-width="120px">
            <div class="form-grid">
              <el-form-item label="名称">
                <el-input v-model="channelForm.name" placeholder="例如：运营群" />
              </el-form-item>
              <el-form-item label="类型">
                <el-select v-model="channelForm.channel_type">
                  <el-option label="Telegram" value="telegram" />
                  <el-option label="飞书机器人" value="feishu" />
                </el-select>
              </el-form-item>
              <el-form-item v-if="channelForm.channel_type==='telegram'" label="Chat ID">
                <el-input v-model="channelForm.config.chat_id" placeholder="给机器人发送 /myid 获取" />
              </el-form-item>
              <template v-else>
                <el-form-item class="full-row" label="Webhook">
                  <el-input v-model="channelForm.config.webhook_url" placeholder="飞书自定义机器人 Webhook 地址" />
                </el-form-item>
                <el-form-item class="full-row" label="签名密钥">
                  <el-input v-model="channelForm.config.secret" show-password placeholder="未开启签名可留空" />
                </el-form-item>
              </template>
              <el-form-item label="启用">
                <el-switch v-model="channelForm.enabled" />
              </el-form-item>
            </div>
            <el-button type="success" @click="saveChannel">保存渠道</el-button>
          </el-form>
        </el-card>

        <el-table :data="channels" style="width: 100%">
          <el-table-column prop="name" label="名称" />
          <el-table-column label="类型">
            <template #default="{ row }">{{ channelTypeText(row.channel_type) }}</template>
          </el-table-column>
          <el-table-column label="状态">
            <template #default="{ row }">
              <el-tag :type="row.enabled ? 'success' : 'info'">{{ row.enabled ? '启用' : '停用' }}</el-tag>
            </template>
          </el-table-column>
          <el-table-column label="操作" width="220">
            <template #default="{ row }">
              <el-button size="small" @click="editChannel(row)">编辑</el-button>
              <el-button size="small" type="danger" @click="removeChannel(row)">删除</el-button>
            </template>
          </el-table-column>
        </el-table>
      </template>

      <template v-if="activeView==='backup'">
        <el-card class="panel-card">
          <template #header>邮箱自动备份</template>
          <el-form label-width="130px">
            <div class="form-grid">
              <el-form-item label="开启自动备份">
                <el-switch v-model="settingsForm.backup_enabled" active-value="true" inactive-value="false" />
              </el-form-item>
              <el-form-item label="备份时间">
                <el-input v-model="settingsForm.backup_cron" placeholder="0 3 * * *" />
              </el-form-item>
              <el-form-item label="收件邮箱">
                <el-input v-model="settingsForm.backup_email_to" />
              </el-form-item>
              <el-form-item label="SMTP 主机">
                <el-input v-model="settingsForm.smtp_host" />
              </el-form-item>
              <el-form-item label="SMTP 端口">
                <el-input v-model="settingsForm.smtp_port" />
              </el-form-item>
              <el-form-item label="发件邮箱">
                <el-input v-model="settingsForm.smtp_from_email" />
              </el-form-item>
              <el-form-item label="SMTP 账号">
                <el-input v-model="settingsForm.smtp_username" />
              </el-form-item>
              <el-form-item label="SMTP 密码">
                <el-input v-model="settingsForm.smtp_password" show-password />
              </el-form-item>
              <el-form-item label="TLS 加密">
                <el-switch v-model="settingsForm.smtp_use_tls" active-value="true" inactive-value="false" />
              </el-form-item>
            </div>
            <el-button type="primary" @click="saveSettings">保存备份设置</el-button>
            <el-button @click="sendBackupNow">立即发送备份</el-button>
            <el-button @click="downloadBackup">下载全量备份</el-button>
            <el-upload :auto-upload="false" :show-file-list="false" :on-change="restoreBackup" accept=".json" style="display:inline-block;margin-left:12px">
              <el-button type="warning">覆盖恢复</el-button>
            </el-upload>
          </el-form>
        </el-card>
      </template>

      <template v-if="activeView==='settings'">
        <el-card class="panel-card">
          <template #header>系统设置</template>
          <el-form label-width="130px">
            <div class="form-grid">
              <el-form-item label="系统名称">
                <el-input v-model="settingsForm.app_name" />
              </el-form-item>
              <el-form-item label="时区">
                <el-input v-model="settingsForm.scheduler_timezone" />
              </el-form-item>
              <el-form-item label="Bot Token">
                <el-input v-model="settingsForm.telegram_bot_token" show-password />
              </el-form-item>
              <el-form-item label="管理员账号">
                <el-input v-model="settingsForm.web_username" />
              </el-form-item>
              <el-form-item label="管理员密码">
                <el-input v-model="settingsForm.web_password" show-password />
              </el-form-item>
            </div>
            <el-button type="primary" @click="saveSettings">保存系统设置</el-button>
          </el-form>
        </el-card>
      </template>
    </section>
  </main>
</div>

<script>
const { createApp, computed, onUnmounted, ref } = Vue
const { Check, Clock, Delete } = ElementPlusIconsVue

createApp({
  setup() {
    const auth = ref(localStorage.getItem('sn_basic_auth') || '')
    const authed = ref(!!auth.value)
    const setupChecked = ref(false)
    const configured = ref(false)
    const activeView = ref('tasks')
    const login = ref({ username: '', password: '' })
    const setupForm = ref({
      app_name: 'Smart Notifier',
      scheduler_timezone: 'Asia/Shanghai',
      telegram_bot_token: '',
      web_username: 'admin',
      web_password: '',
    })
    const settingsForm = ref({})
    const channels = ref([])
    const channelForm = ref({
      id: null,
      name: '',
      channel_type: 'telegram',
      config: { chat_id: '', webhook_url: '', secret: '' },
      enabled: true,
    })
    const chatId = ref('')
    const statusFilter = ref('')
    const tasks = ref([])
    const now = ref(Date.now())
    const timer = setInterval(() => {
      now.value = Date.now()
    }, 1000)
    const form = ref({
      chat_id: '',
      content: '',
      remarks: '',
      is_recurring: false,
      once_time: '',
      recurring_mode: 'weekly',
      hhmm: '09:30',
      weekday: '1',
      month_day: 1,
      year_mmdd: '01-01',
      interval_days: 3,
      channel_ids: [],
    })
    const edit = ref({
      visible: false,
      taskId: null,
      form: { content: '', remarks: '', trigger_time: '', cron_expr: '', status: 'pending', channel_ids: [] },
    })

    onUnmounted(() => {
      clearInterval(timer)
    })

    const authFetch = (url, options = {}) => {
      const headers = Object.assign(
        {},
        options.headers || {},
        auth.value ? { Authorization: `Basic ${auth.value}` } : {}
      )
      return fetch(url, Object.assign({}, options, { headers }))
    }

    const checkSetup = async () => {
      try {
        const res = await fetch('/api/setup/status')
        const data = await res.json()
        configured.value = !!data.configured
        if (!configured.value) authed.value = false
      } finally {
        setupChecked.value = true
      }
    }

    const logout = () => {
      localStorage.removeItem('sn_basic_auth')
      auth.value = ''
      authed.value = false
    }

    const channelTypeText = (type) => {
      if (type === 'feishu') return '飞书'
      if (type === 'telegram') return 'Telegram'
      return type
    }

    const parseTaskDate = (value) => {
      if (!value) return null
      const normalized = String(value).includes('T') ? value : String(value).replace(' ', 'T')
      const parsed = new Date(normalized)
      return Number.isNaN(parsed.getTime()) ? null : parsed
    }

    const pad2 = (value) => String(value).padStart(2, '0')

    const buildLocalDate = (year, month, day, hour, minute) => {
      const date = new Date(year, month - 1, day, hour, minute, 0, 0)
      return Number.isNaN(date.getTime()) ? null : date
    }

    const daysInMonth = (year, month) => new Date(year, month, 0).getDate()

    const nextFromCron = (cronExpr) => {
      if (!cronExpr) return null

      if (cronExpr.startsWith('every_ndays:')) {
        const [, daysText, hourText, minuteText] = cronExpr.split(':')
        const days = Number(daysText)
        const hour = Number(hourText)
        const minute = Number(minuteText)
        if (!Number.isFinite(days) || !Number.isFinite(hour) || !Number.isFinite(minute)) return null

        const candidate = new Date(now.value)
        candidate.setHours(hour, minute, 0, 0)
        if (candidate.getTime() <= now.value) {
          candidate.setDate(candidate.getDate() + Math.max(1, days))
        }
        return candidate
      }

      const parts = cronExpr.trim().split(/\s+/)
      if (parts.length !== 5) return null

      const [minuteText, hourText, dayText, monthText, weekdayText] = parts
      const minute = Number(minuteText)
      const hour = Number(hourText)
      if (!Number.isFinite(minute) || !Number.isFinite(hour)) return null

      const nowDate = new Date(now.value)

      if (dayText === '*' && monthText === '*' && weekdayText !== '*') {
        const targetWeekday = Number(weekdayText)
        if (!Number.isFinite(targetWeekday)) return null
        const jsTarget = targetWeekday === 0 ? 0 : targetWeekday
        const candidate = new Date(nowDate)
        const diff = (jsTarget - candidate.getDay() + 7) % 7
        candidate.setDate(candidate.getDate() + diff)
        candidate.setHours(hour, minute, 0, 0)
        if (candidate.getTime() <= now.value) candidate.setDate(candidate.getDate() + 7)
        return candidate
      }

      if (dayText !== '*' && monthText === '*' && weekdayText === '*') {
        const day = Number(dayText)
        if (!Number.isFinite(day)) return null
        for (let offset = 0; offset < 14; offset += 1) {
          const probe = new Date(nowDate.getFullYear(), nowDate.getMonth() + offset, 1)
          const month = probe.getMonth() + 1
          const year = probe.getFullYear()
          const safeDay = Math.min(day, daysInMonth(year, month))
          const candidate = buildLocalDate(year, month, safeDay, hour, minute)
          if (candidate && candidate.getTime() > now.value) return candidate
        }
      }

      if (dayText !== '*' && monthText !== '*' && weekdayText === '*') {
        const day = Number(dayText)
        const months = monthText.split(',').map(Number).filter(Number.isFinite)
        if (!Number.isFinite(day) || !months.length) return null
        for (let yearOffset = 0; yearOffset <= 3; yearOffset += 1) {
          const year = nowDate.getFullYear() + yearOffset
          for (const month of months) {
            const safeDay = Math.min(day, daysInMonth(year, month))
            const candidate = buildLocalDate(year, month, safeDay, hour, minute)
            if (candidate && candidate.getTime() > now.value) return candidate
          }
        }
      }

      return null
    }

    const getTaskTargetTime = (task) => {
      if (task.next_run_time) return task.next_run_time
      if (task.trigger_time) return task.trigger_time
      const fallback = task.is_recurring ? nextFromCron(task.cron_expr) : null
      return fallback ? fallback.toISOString() : null
    }

    const getCountdownState = (targetTime) => {
      const target = parseTaskDate(targetTime)
      if (!target) {
        return { text: '-', color: '#94a3b8', isUrgent: false }
      }

      const diff = target.getTime() - now.value
      const hour = 60 * 60 * 1000
      const day = 24 * hour

      if (diff <= 0) {
        return { text: '已超时 / 触发中', color: '#ef4444', isUrgent: true }
      }

      if (diff <= day) {
        const hours = Math.floor(diff / hour)
        const minutes = Math.floor((diff % hour) / (60 * 1000))
        const seconds = Math.floor((diff % (60 * 1000)) / 1000)
        return {
          text: `${pad2(hours)}:${pad2(minutes)}:${pad2(seconds)}`,
          color: '#f97316',
          isUrgent: true,
        }
      }

      if (diff <= 7 * day) {
        const days = Math.floor(diff / day)
        const hours = Math.floor((diff % day) / hour)
        return { text: `${days}天 ${hours}小时后`, color: '#3b82f6', isUrgent: false }
      }

      const days = Math.floor(diff / day)
      const hours = Math.floor((diff % day) / hour)
      return { text: `${days}天 ${hours}小时后`, color: '#22c55e', isUrgent: false }
    }

    const isSameDay = (a, b) =>
      a.getFullYear() === b.getFullYear() &&
      a.getMonth() === b.getMonth() &&
      a.getDate() === b.getDate()

    const isThisWeek = (date) => {
      const now = new Date()
      const start = new Date(now)
      const day = start.getDay() || 7
      start.setHours(0, 0, 0, 0)
      start.setDate(start.getDate() - day + 1)
      const end = new Date(start)
      end.setDate(start.getDate() + 7)
      return date >= start && date < end
    }

    const todayPending = computed(() => {
      const today = new Date()
      return tasks.value.filter((task) => {
        const when = parseTaskDate(task.next_run_time || task.trigger_time)
        return task.status === 'pending' && when && isSameDay(when, today)
      }).length
    })

    const knownChatIds = computed(() => {
      const ids = tasks.value.map((task) => task.chat_id).filter(Boolean)
      return [...new Set(ids)]
    })

    const enabledChannels = computed(() => channels.value.filter((item) => item.enabled))

    const weekCompleted = computed(() =>
      tasks.value.filter((task) => {
        const created = parseTaskDate(task.created_at)
        return task.status === 'completed' && created && isThisWeek(created)
      }).length
    )

    const doLogin = async () => {
      const token = btoa(`${login.value.username}:${login.value.password}`)
      const res = await fetch('/api/tasks', { headers: { Authorization: `Basic ${token}` } })
      if (res.status === 401) return ElementPlus.ElMessage.error('账号或密码错误')
      auth.value = token
      localStorage.setItem('sn_basic_auth', token)
      authed.value = true
      await afterLoginLoad()
    }

    const saveInitialSetup = async () => {
      if (!setupForm.value.telegram_bot_token || !setupForm.value.web_password) {
        return ElementPlus.ElMessage.error('请填写 Bot Token 和管理员密码')
      }
      const res = await fetch('/api/setup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(setupForm.value),
      })
      if (!res.ok) return ElementPlus.ElMessage.error(await res.text())
      configured.value = true
      login.value.username = setupForm.value.web_username
      login.value.password = setupForm.value.web_password
      ElementPlus.ElMessage.success('初始化完成，请登录')
    }

    const recurringExpr = () => {
      const [hh, mm] = form.value.hhmm.split(':')
      if (!hh || !mm) throw new Error('时间格式为HH:MM')
      const h = parseInt(hh, 10)
      const m = parseInt(mm, 10)
      const mode = form.value.recurring_mode
      if (mode === 'weekly') return `${m} ${h} * * ${form.value.weekday === '7' ? 0 : form.value.weekday}`
      if (mode === 'monthly') return `${m} ${h} ${parseInt(form.value.month_day, 10)} * *`
      if (mode === 'quarterly') return `${m} ${h} ${parseInt(form.value.month_day, 10)} 1,4,7,10 *`
      if (mode === 'yearly') {
        const [mon, day] = form.value.year_mmdd.split('-')
        return `${m} ${h} ${parseInt(day, 10)} ${parseInt(mon, 10)} *`
      }
      if (mode === 'interval_days') {
        return `every_ndays:${parseInt(form.value.interval_days, 10)}:${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`
      }
      throw new Error('未知循环方式')
    }

    const load = async () => {
      const p = new URLSearchParams()
      if (chatId.value) p.set('chat_id', chatId.value)
      if (statusFilter.value) p.set('status', statusFilter.value)
      const res = await authFetch(`/api/tasks${p.toString() ? `?${p.toString()}` : ''}`)
      if (res.status === 401) return logout()
      if (!res.ok) return ElementPlus.ElMessage.error('查询失败')
      tasks.value = await res.json()
    }

    const createTask = async () => {
      try {
        if (!form.value.chat_id || !form.value.content) {
          return ElementPlus.ElMessage.error('请填写Chat ID和内容')
        }
        const payload = {
          content: form.value.content,
          remarks: form.value.remarks,
          is_recurring: form.value.is_recurring,
          trigger_time: form.value.is_recurring ? null : form.value.once_time,
          cron_expr: form.value.is_recurring ? recurringExpr() : null,
          chat_id: form.value.chat_id,
          channel_ids: form.value.channel_ids,
        }
        const res = await authFetch('/api/tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        })
        if (res.status === 401) return logout()
        if (!res.ok) return ElementPlus.ElMessage.error(await res.text())
        await load()
        ElementPlus.ElMessage.success('创建成功')
        form.value.content = ''
        form.value.remarks = ''
      } catch (e) {
        ElementPlus.ElMessage.error(e.message || '创建失败')
      }
    }

    const openEdit = (task) => {
      edit.value.taskId = task.id
      edit.value.form = {
        content: task.content || '',
        remarks: task.remarks || '',
        trigger_time: task.trigger_time || '',
        cron_expr: task.cron_expr || '',
        status: task.status || 'pending',
        channel_ids: task.channel_ids || [],
      }
      edit.value.visible = true
    }

    const saveEdit = async () => {
      const payload = { ...edit.value.form }
      if (!payload.trigger_time) delete payload.trigger_time
      const res = await authFetch(`/api/tasks/${edit.value.taskId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      })
      if (res.status === 401) return logout()
      if (!res.ok) return ElementPlus.ElMessage.error(await res.text())
      edit.value.visible = false
      await load()
      ElementPlus.ElMessage.success('修改成功')
    }

    const markDone = async (task) => {
      const res = await authFetch(`/api/tasks/${task.id}/status`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: 'completed' }),
      })
      if (res.status === 401) return logout()
      if (!res.ok) return ElementPlus.ElMessage.error('更新失败')
      await load()
    }

    const deleteTask = async (task) => {
      try {
        await ElementPlus.ElMessageBox.confirm(
          `确认删除任务 #${task.id} 吗？删除后不可恢复。`,
          '删除任务',
          { type: 'warning', confirmButtonText: '删除', cancelButtonText: '取消' }
        )
      } catch (e) {
        return
      }
      const res = await authFetch(`/api/tasks/${task.id}`, { method: 'DELETE' })
      if (res.status === 401) return logout()
      if (!res.ok) return ElementPlus.ElMessage.error('删除失败')
      await load()
      ElementPlus.ElMessage.success('删除成功')
    }

    const loadSettings = async () => {
      const res = await authFetch('/api/settings')
      if (res.status === 401) return logout()
      if (!res.ok) return ElementPlus.ElMessage.error('设置加载失败')
      settingsForm.value = await res.json()
    }

    const saveSettings = async () => {
      const res = await authFetch('/api/settings', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(settingsForm.value),
      })
      if (res.status === 401) return logout()
      if (!res.ok) return ElementPlus.ElMessage.error(await res.text())
      settingsForm.value = await res.json()
      ElementPlus.ElMessage.success('设置已保存')
    }

    const loadChannels = async () => {
      const res = await authFetch('/api/channels')
      if (res.status === 401) return logout()
      if (!res.ok) return ElementPlus.ElMessage.error('渠道加载失败')
      channels.value = await res.json()
    }

    const resetChannelForm = () => {
      channelForm.value = {
        id: null,
        name: '',
        channel_type: 'telegram',
        config: { chat_id: '', webhook_url: '', secret: '' },
        enabled: true,
      }
    }

    const saveChannel = async () => {
      if (!channelForm.value.name) return ElementPlus.ElMessage.error('请填写渠道名称')
      const id = channelForm.value.id
      const res = await authFetch(id ? `/api/channels/${id}` : '/api/channels', {
        method: id ? 'PUT' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(channelForm.value),
      })
      if (res.status === 401) return logout()
      if (!res.ok) return ElementPlus.ElMessage.error(await res.text())
      await loadChannels()
      resetChannelForm()
      ElementPlus.ElMessage.success('渠道已保存')
    }

    const editChannel = (row) => {
      channelForm.value = {
        id: row.id,
        name: row.name,
        channel_type: row.channel_type,
        config: Object.assign({ chat_id: '', webhook_url: '', secret: '' }, row.config || {}),
        enabled: row.enabled,
      }
    }

    const removeChannel = async (row) => {
      try {
        await ElementPlus.ElMessageBox.confirm(`确认删除渠道「${row.name}」吗？`, '删除渠道', { type: 'warning' })
      } catch (e) {
        return
      }
      const res = await authFetch(`/api/channels/${row.id}`, { method: 'DELETE' })
      if (res.status === 401) return logout()
      if (!res.ok) return ElementPlus.ElMessage.error('删除失败')
      await loadChannels()
      ElementPlus.ElMessage.success('渠道已删除')
    }

    const sendBackupNow = async () => {
      await saveSettings()
      const res = await authFetch('/api/backup/send-now', { method: 'POST' })
      if (res.status === 401) return logout()
      if (!res.ok) return ElementPlus.ElMessage.error(await res.text())
      ElementPlus.ElMessage.success('备份邮件已发送')
    }

    const downloadBackup = async () => {
      const res = await authFetch('/api/backup/export')
      if (res.status === 401) return logout()
      if (!res.ok) return ElementPlus.ElMessage.error('导出失败')
      const blob = await res.blob()
      const url = URL.createObjectURL(blob)
      const a = document.createElement('a')
      a.href = url
      a.download = 'smart-notifier-backup.json'
      a.click()
      URL.revokeObjectURL(url)
    }

    const restoreBackup = async (uploadFile) => {
      try {
        await ElementPlus.ElMessageBox.confirm('覆盖恢复会替换任务、渠道和系统设置，确认继续吗？', '覆盖恢复', { type: 'warning' })
      } catch (e) {
        return
      }
      const body = new FormData()
      body.append('file', uploadFile.raw)
      const res = await authFetch('/api/backup/restore', { method: 'POST', body })
      if (res.status === 401) return logout()
      if (!res.ok) return ElementPlus.ElMessage.error(await res.text())
      await afterLoginLoad()
      ElementPlus.ElMessage.success('恢复完成')
    }

    const afterLoginLoad = async () => {
      await Promise.all([load(), loadSettings(), loadChannels()])
    }

    checkSetup().then(() => {
      if (authed.value && configured.value) afterLoginLoad()
    })

    return {
      authed,
      setupChecked,
      configured,
      activeView,
      login,
      setupForm,
      settingsForm,
      saveInitialSetup,
      doLogin,
      logout,
      chatId,
      statusFilter,
      tasks,
      todayPending,
      weekCompleted,
      knownChatIds,
      channels,
      enabledChannels,
      channelForm,
      channelTypeText,
      saveChannel,
      editChannel,
      removeChannel,
      saveSettings,
      sendBackupNow,
      downloadBackup,
      restoreBackup,
      getTaskTargetTime,
      getCountdownState,
      Check,
      Clock,
      Delete,
      form,
      createTask,
      load,
      edit,
      openEdit,
      saveEdit,
      markDone,
      deleteTask,
    }
  },
}).use(ElementPlus).mount('#app')
</script>
</body>
</html>
